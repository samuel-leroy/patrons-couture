<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stegie Créations</title>
<meta name="theme-color" content="#fdf5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2b2230" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:#fdf5f2;--bg2:#fff;--line:#f1dfe2;--ink:#43303b;--muted:#9a8590;--accent:#cf6a85;--accent2:#e8957f;--accent-deep:#b4506b;--accent-ink:#fff;
--card:#fff;--cink:#43303b;--cmut:#9a8590;--soft:#fbe9ee;--danger:#c4465c;--ok:#5fa87e;--warn:#e9a04a;--shadow:0 8px 24px rgba(207,106,133,.13);--glow:0 8px 18px rgba(207,106,133,.32);
--lav-b:#ece7fb;--lav-f:#6a56b5;--sage-b:#def1e5;--sage-f:#3d7a57;--rose-b:#fde4ea;--rose-f:#b8435c;--honey-b:#fff0d3;--honey-f:#96641a;--sky-b:#dff0fa;--sky-f:#2f6f99;--neu-b:#f4ecef;--neu-f:#86707c;
--disp:'Fraunces',Georgia,'Times New Roman',serif;--body:'Quicksand',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{
--bg:#2b2230;--bg2:#372c3d;--line:#4a3c52;--ink:#f6e9ee;--muted:#b9a4b3;--accent:#ee9bb0;--accent2:#f3b394;--accent-deep:#f2a7ba;--accent-ink:#2b2230;
--card:#3a2f41;--cink:#f6e9ee;--cmut:#b9a4b3;--soft:#44354b;--danger:#ff8a9c;--ok:#7fcf9f;--warn:#f0b35c;--shadow:0 8px 24px rgba(0,0,0,.28);--glow:0 8px 18px rgba(238,155,176,.25);
--lav-b:#4a3f66;--lav-f:#cdbff5;--sage-b:#34503f;--sage-f:#a9dcbb;--rose-b:#5a3441;--rose-f:#ffb3c5;--honey-b:#5b4a2a;--honey-f:#f6d594;--sky-b:#2f4a5d;--sky-f:#a9d7f2;--neu-b:#463a4c;--neu-f:#cdbac6}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.ic{display:inline-flex;line-height:0}.ic svg{width:1em;height:1em}
#app{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px calc(120px + env(safe-area-inset-bottom))}
.hdr{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.hl{flex:1;min-width:0}
h1{font:700 min(6.6vw,40px)/1.15 var(--disp);margin:0;white-space:nowrap;overflow:hidden;padding:0 4px 3px 0;letter-spacing:-.2px}
h1 em{font-style:italic;color:var(--accent)}
.sub{color:var(--muted);font-size:16px;margin:2px 0 0;font-weight:600}
.hr{display:flex;gap:10px;align-items:center;flex:none}
.rb{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--accent);display:grid;place-items:center;position:relative;padding:0;font-size:24px;box-shadow:var(--shadow)}
.rb.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent}
.rb svg.cloud{width:32px;height:32px}
.cloud .arr{stroke:var(--card)}
.dot{position:absolute;right:1px;top:1px;width:13px;height:13px;border-radius:50%;background:var(--warn);border:2px solid var(--card)}
.dot.ok{background:var(--ok)}.dot.err{background:var(--danger)}
.dot.busy{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.lbl{font:italic 700 21px var(--disp);color:var(--accent-deep);margin:24px 0 12px}
.muted{color:var(--muted)}.sm{font-size:15px}
.bigt{font:600 20px/1.3 var(--disp);margin:8px 0}
.pillbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 20px 9px 12px;font:700 17px var(--body);color:var(--accent-deep);box-shadow:var(--shadow)}
.pillbtn .ic{font-size:20px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:13px 20px;font-weight:700;box-shadow:var(--shadow)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent;box-shadow:var(--glow)}
.btn.big{display:block;width:100%;padding:17px;font-size:18px}
.btn.dng{color:var(--danger)}
.btn:disabled{opacity:.55}
.btn .ic{vertical-align:-3px;margin-right:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.sr{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.sr .in{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 18px;min-width:0;box-shadow:var(--shadow)}
.sr .in .ic{font-size:20px;color:var(--accent)}
.sr input{flex:1;min-width:0;background:none;border:0;outline:0;padding:14px 0;font-size:16px}
.sr .rb{width:50px;height:50px;font-size:22px;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:4px 20px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:24px;padding:14px 18px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:180px}
.card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;background:var(--card);color:var(--cink);border-radius:28px;padding:14px 18px 14px 14px;margin-bottom:14px;width:100%;border:1px solid var(--line);text-align:left;box-shadow:var(--shadow)}
.th{width:84px;height:104px;border-radius:22px;background:linear-gradient(135deg,var(--soft),var(--lav-b));overflow:hidden;display:grid;place-items:center;font:700 38px var(--disp);color:var(--accent)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.nm{font:700 21px/1.15 var(--disp);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mt{color:var(--cmut);font-size:15px;margin-top:4px;font-weight:600}
.pl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font:700 13px var(--body);border-radius:999px;padding:4px 11px;background:var(--lav-b);color:var(--lav-f)}
.pill.g{background:var(--sage-b);color:var(--sage-f)}.pill.r{background:var(--rose-b);color:var(--rose-f)}.pill.n{background:var(--neu-b);color:var(--neu-f)}.pill.y{background:var(--honey-b);color:var(--honey-f)}
.chev{color:var(--accent);font-size:24px;opacity:.7}
.mi{padding:14px 18px 14px 14px}
.mi .nm{font-size:21px;-webkit-line-clamp:2}
.mic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--lav-b);color:var(--lav-f)}
.mic.c2{background:var(--sage-b);color:var(--sage-f)}.mic.c3{background:var(--rose-b);color:var(--rose-f)}.mic.c4{background:var(--honey-b);color:var(--honey-f)}.mic.c5{background:var(--sky-b);color:var(--sky-f)}.mic.c6{background:var(--neu-b);color:var(--neu-f)}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
.empty h2{font:700 28px var(--disp);color:var(--ink);margin:0 0 8px}
.foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 72%,transparent);padding:22px 20px calc(14px + env(safe-area-inset-bottom));z-index:6}
.foot .btn{max-width:720px;margin:0 auto}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg)}
.sh-in{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;height:100%}
.sh-head{padding:calc(14px + env(safe-area-inset-top)) 20px 10px;display:flex;align-items:center;gap:10px}
.sh-head .sp{flex:1}
.sh-head .rb{width:46px;height:46px;font-size:22px}
.sh-body{flex:1;overflow:auto;padding:6px 20px 28px}
.sh-foot{padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:var(--bg);display:flex;gap:10px}
.sh-foot .btn{flex:1;padding:16px;font-size:17px}
.big{width:100%}
img.big{max-height:56vh;object-fit:contain;background:var(--soft);border-radius:28px;display:block}
.dtitle{font:700 30px/1.1 var(--disp);margin:16px 0 4px}
.info{background:var(--card);color:var(--cink);border-radius:28px;padding:4px 20px;margin:14px 0;border:1px solid var(--line);box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:118px 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}.kv span:first-child{color:var(--cmut);font-weight:600}
label.f,div.f{display:block;margin:16px 0 0;font:700 14px var(--body);color:var(--accent-deep)}
.f input[type=text],.f select,.f textarea{display:block;width:100%;margin-top:6px;padding:13px 16px;border:1px solid var(--line);border-radius:20px;background:var(--card);font-size:16px;font-weight:500;color:var(--ink)}
.f input[type=file]{display:block;margin-top:6px;width:100%;color:var(--muted);font-size:15px}
.f textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tg{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 15px;margin:0 8px 8px 0;font-size:15px;font-weight:600}
.rm{border:0;background:none;padding:0 0 0 8px;color:var(--muted);font-size:18px;line-height:1}
.addrow{display:flex;gap:8px;margin-top:4px}
.addrow input{flex:1;min-width:0;padding:12px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:16px}
.trow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);color:var(--cink);border-radius:24px;padding:14px 18px;margin-bottom:12px;border:1px solid var(--line);box-shadow:var(--shadow)}
.trow .nm{font-size:19px}
.trow .btn{padding:9px 16px;font-size:15px;box-shadow:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;z-index:50;max-width:90vw;font-size:15px;font-weight:700;box-shadow:0 8px 22px rgba(0,0,0,.25)}

.ico{display:inline-block;background-color:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;width:1em;height:1em}

.homehub{display:flex;flex-direction:column;margin-bottom:-100px;padding-bottom:18px;min-height:calc(100vh - 135px);min-height:calc(100dvh - 135px)}
.homelogo{display:flex;justify-content:center;margin:34px 0 0;padding-top:20px;margin-top:auto;color:var(--rose-f);opacity:.5}
.homelogo .ico{width:84px;height:84px}

.pgrid{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.pthumb{position:relative;width:92px;height:92px;border-radius:22px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}

/* ============ OUTILS ============ */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==='class') e.className=v;
    else if (k==='style') e.style.cssText=v;
    else if (k==='value') e.value=v;
    else if (k==='checked') e.checked=true;
    else if (k==='html') e.innerHTML=v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v===true?'':v);
  }
  for (const c of kids.flat()){ if (c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;
}
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fold = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function toast(msg){ const t=h('div',{class:'toast'},msg); document.body.append(t); setTimeout(()=>t.remove(),3200); }
function fmtDate(ts){ return ts? new Date(ts).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}) : '—'; }
// Mémoire locale propre à l'application : clés préfixées pour ne jamais se mélanger à celles du Carnet d'entretien.
const LS = new Proxy({}, {
  get:(_,k)=>{ try{ return localStorage.getItem('patrons_'+k) }catch(e){ return null } },
  set:(_,k,v)=>{ try{ localStorage.setItem('patrons_'+k,String(v)) }catch(e){} return true },

});

/* ============ ICÔNES ============ */

/* stockage local (IndexedDB) : copie de travail, fonctionne hors connexion */
const idb = () => new Promise((res,rej)=>{const r=indexedDB.open('patrons',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function kvGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function kvSet(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

/* ============ MODÈLE DE DONNÉES (jamais de perte) ============ */
function normRec(p){
  const r = Object.assign({id:'',name:'',category:'',person:'',season:'',fabrics:[],matTypes:[],compositions:[],matV:0,yardage:[],needles:'',needleType:'',strands:'',creator:'',difficulty:'',source:'',sizes:'',status:'',tags:[],notes:'',favorite:false,
    photoId:'',thumb:'',pdfId:'',pdfName:'',photos:[],pdfs:[],folderId:'',photosFolderId:'',pdfFolderId:'',created:0,updated:0,deleted:false,deletedAt:0}, p);
  // anciennes fiches (une seule photo / un seul PDF) : on les range dans les nouvelles listes, sans rien supprimer
  // ancien champ « tissus conseillés » : Jersey → type de matière, le reste → composition (l'ancien champ est conservé)
  if (!r.matV){ if(!r.matTypes.length&&!r.compositions.length){ for(const x of r.fabrics){ if(/jersey|maille/i.test(x)) r.matTypes.push('Jersey / Maille'); else r.compositions.push(x); } } r.matV=1; }
  if (!r.photos.length && r.photoId) r.photos=[{id:r.photoId,thumb:r.thumb||'',parent:''}];
  if (!r.pdfs.length && r.pdfId) r.pdfs=[{id:r.pdfId,name:r.pdfName||'patron.pdf',parent:''}];
  return r;
}
function normTextile(t){
  const r = Object.assign({id:'',name:'',material:'',matTypes:[],compositions:[],matV:0,color:'',width:'',length:'',unit:'',store:'',care:'',location:'',scrap:false,prewashed:false,notes:'',favorite:false,photoId:'',thumb:'',photos:[],folderId:'',created:0,updated:0,deleted:false,deletedAt:0}, t);
  if (!r.photos.length && r.photoId) r.photos=[{id:r.photoId,thumb:r.thumb||'',parent:''}];
  // ancien champ « matière » (liste unique) : Jersey → type de matière, le reste → composition (l'ancien champ est conservé)
  if (!r.matV){ if(r.material&&!r.matTypes.length&&!r.compositions.length){ if(/jersey|maille/i.test(r.material)) r.matTypes.push('Jersey / Maille'); else r.compositions.push(r.material); } r.matV=1; }
  // anciennes fiches : le métrage était saisi en mètres → converti une seule fois en cm (marqueur unit)
  if (r.unit!=='cm'){
    if (/^\s*\d+([.,]\d+)?\s*m?\s*$/i.test(String(r.length))) r.length = String(Math.round(parseFloat(String(r.length).replace(',','.'))*100));
    r.unit='cm';
  }
  return r;
}
// Les champs inconnus sont conservés ; les nouveaux champs reçoivent une valeur par défaut.
function migrate(d){
  d = d || {};
  d.patterns = (d.patterns||[]).map(normRec);
  d.textiles = (d.textiles||[]).map(normTextile);
  d.knits = (d.knits||[]).map(normRec);
  d.settings = Object.assign({updated:0}, clone(DEFAULT_SETTINGS), d.settings||{});
  d.purged = d.purged || {};
  d.version = Math.max(d.version||1, DATA_VERSION);
  // Exemple pour plus tard : if (d.version < 2) { ...transformer sans rien supprimer...; d.version = 2; }
  return d;
}
function mergeList(x,y,purged){
  const m = new Map();
  for (const p of [...x, ...y]){
    if (purged[p.id]) continue;
    const q = m.get(p.id);
    if (!q || (p.updated||0) > (q.updated||0)) m.set(p.id, p);
  }
  return [...m.values()];
}
function merge(a,b){
  const purged = Object.assign({}, a.purged, b.purged);
  // Les clés inconnues (venant d'une version plus récente) sont conservées telles quelles.
  return Object.assign({}, b, a, {version:Math.max(a.version,b.version),
    patterns:mergeList(a.patterns,b.patterns,purged), textiles:mergeList(a.textiles,b.textiles,purged), knits:mergeList(a.knits,b.knits,purged),
    settings:(a.settings.updated||0)>=(b.settings.updated||0)?a.settings:b.settings, purged});
}
const byId = (x,y)=>x.id<y.id?-1:1;
const sig = d => JSON.stringify({p:d.patterns.slice().sort(byId),t:d.textiles.slice().sort(byId),k:d.knits.slice().sort(byId),s:d.settings,u:d.purged});

const state = {data:migrate(null), dirty:false, view:'home',
  f:{q:'',cat:'',person:'',season:'',status:'',mtype:'',comp:'',fav:false,sort:'recent'}, fk:{q:'',cat:'',person:'',season:'',status:'',mtype:'',comp:'',fav:false,sort:'recent'}, t:{q:'',mat:''},
  sync:{st:'off',last:+LS.lastSync||0,err:''}};
async function saveLocal(){ await kvSet('data',{data:state.data,dirty:state.dirty}); }

/* ============ AUTH GOOGLE + API DRIVE ============ */
let tokenClient=null, tok=null, tokExp=0;
function configured(){ return !CLIENT_ID.startsWith('COLLER_ICI'); }
function whenGis(cb){ if (window.google && google.accounts && google.accounts.oauth2) cb(); else setTimeout(()=>whenGis(cb),300); }
function getToken(interactive){
  if (tok && Date.now()<tokExp) return Promise.resolve(tok);
  return new Promise((res,rej)=>{
    if (!configured()) return rej(new Error('ID client Google non renseigné'));
    if (!(window.google && google.accounts)) return rej(new Error('Google indisponible (hors connexion ?)'));
    if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:()=>{}});
    tokenClient.callback = r => {
      if (r.error) return rej(new Error(r.error));
      tok=r.access_token; tokExp=Date.now()+(r.expires_in-90)*1000; LS.signed='1'; rememberAccount(tok); res(tok);
    };
    tokenClient.error_callback = e => rej(new Error(e.type||'connexion annulée'));
    tokenClient.requestAccessToken({prompt: LS.signed ? '' : (interactive?'select_account':''), hint: LS.hint || undefined});
  });
}
async function rememberAccount(t){
  if (LS.hint) return;
  try{
    const r = await fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)',{headers:{Authorization:'Bearer '+t}});
    const j = await r.json();
    if (j.user && j.user.emailAddress) LS.hint = j.user.emailAddress;
  }catch(e){}
}
function switchAccount(){
  delete LS.hint; delete LS.signed; delete LS.filesId; ids.files=''; resetDriveIds(); tok=null; tokExp=0;
  sync(true).then(render);
}
async function api(url, opts={}, retry=true){
  const t = await getToken(false);
  const r = await fetch(url, Object.assign({}, opts, {headers:Object.assign({Authorization:'Bearer '+t}, opts.headers||{})}));
  if (r.status===401 && retry){ tok=null; return api(url,opts,false); }
  if (!r.ok) throw new Error('Drive '+r.status+' '+(await r.text()).slice(0,160));
  return r;
}
const DRIVE='https://www.googleapis.com/drive/v3/files', UP='https://www.googleapis.com/upload/drive/v3/files';
const ids = {root:LS.rootId||'', files:LS.filesId||'', backups:LS.backupsId||'', data:LS.dataId||'', garments:LS.garmentsId||'', textiles:LS.textilesId||'', knits:LS.knitsId||''};
async function listFiles(q, extra=''){
  const r = await api(DRIVE+'?fields=files(id,name,createdTime)&pageSize=100&q='+encodeURIComponent(q)+extra);
  return (await r.json()).files;
}
async function ensureFolder(name, parent){
  const q = `name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false` + (parent?` and '${parent}' in parents`:'');
  const f = await listFiles(q);
  if (f.length) return f[0].id;
  const r = await api(DRIVE+'?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:parent?[parent]:undefined})});
  return (await r.json()).id;
}
async function ensureFolders(){
  if (!ids.root){ ids.root = await ensureFolder(ROOT_NAME); LS.rootId=ids.root; }
  if (!ids.backups){ ids.backups = await ensureFolder('Sauvegardes', ids.root); LS.backupsId=ids.backups; }
  if (!ids.garments){ ids.garments = await ensureFolder('Vêtements', ids.root); LS.garmentsId=ids.garments; }
  if (!ids.knits){ ids.knits = await ensureFolder('Tricot', ids.root); LS.knitsId=ids.knits; }
  if (!ids.textiles){ ids.textiles = await ensureFolder('Tissus', ids.root); LS.textilesId=ids.textiles; }
}
function resetDriveIds(){
  for (const k of ['root','backups','data','garments','textiles','knits']) ids[k]='';
  for (const k of ['rootId','backupsId','dataId','garmentsId','textilesId','knitsId']) delete LS[k];
}
const cleanName = n => (n||'').replace(/[\\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,80) || 'Vêtement';
async function createFolder(name, parent){
  const r = await api(DRIVE+'?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:[parent]})});
  return (await r.json()).id;
}
async function renameFile(id, name){ await api(DRIVE+'/'+id+'?fields=id',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); }
async function moveFile(id, to, from){
  if (!from){ try{ from = (await (await api(DRIVE+'/'+id+'?fields=parents')).json()).parents||[]; from=from.filter(x=>x!==to).join(','); }catch(e){ from=''; } }
  await api(DRIVE+'/'+id+'?fields=id&addParents='+to+(from?'&removeParents='+from:''),{method:'PATCH',headers:{'Content-Type':'application/json'},body:'{}'}); }
// Un dossier par vêtement : Patrons couture › Vêtements › <nom> › Photos / Patrons
async function garmentFolder(p, which, folder){
  await ensureFolders();
  if (!p.folderId){ p.folderId = await createFolder(cleanName(p.name), ids[folder||'garments']); p.photosFolderId=p.pdfFolderId=''; }
  const key = which==='photos' ? 'photosFolderId' : 'pdfFolderId';
  if (!p[key]) p[key] = await createFolder(which==='photos'?'Photos':'Patrons', p.folderId);
  return p[key];
}
async function garmentUpload(p, which, blob, name, mime, folder){
  for (let attempt=0; attempt<2; attempt++){
    try{ return await multipart({name,parents:[await garmentFolder(p,which,folder)]}, blob, mime); }
    catch(e){
      if (attempt===0 && / 404 /.test(e.message)){ p.folderId=p.photosFolderId=p.pdfFolderId=''; resetDriveIds(); continue; }  // dossier supprimé à la main : on le recrée
      throw e;
    }
  }
}
// Un dossier par tissu : Patrons couture › Tissus › <nom>
async function textileUpload(t, blob, name, mime){
  for (let attempt=0; attempt<2; attempt++){
    try{
      await ensureFolders();
      if (!t.folderId) t.folderId = await createFolder(cleanName(t.name)||'Tissu', ids.textiles);
      return await multipart({name,parents:[t.folderId]}, blob, mime);
    }catch(e){ if (attempt===0 && / 404 /.test(e.message)){ t.folderId=''; resetDriveIds(); continue; } throw e; }
  }
}
async function tidyTextile(t){
  try{ for (const x of t.photos) if (!x.parent){ await ensureFolders(); if(!t.folderId) t.folderId=await createFolder(cleanName(t.name)||'Tissu',ids.textiles); await moveFile(x.id,t.folderId,ids.textiles); x.parent=t.folderId; } }
  catch(e){ console.warn('rangement reporté',e); }
}
// range dans le dossier du vêtement les fichiers des anciennes fiches (dossier « Fichiers »)
async function tidyFiles(p, folder){
  try{
    for (const [list,which] of [[p.photos,'photos'],[p.pdfs,'pdfs']])
      for (const x of list) if (!x.parent){ const to=await garmentFolder(p,which,folder); await moveFile(x.id,to,ids.files); x.parent=to; }
  }catch(e){ console.warn('rangement reporté',e); }
}
function purgeFiles(p){
  const all=new Set([...(p.photos||[]),...(p.pdfs||[])].map(x=>x.id)); if(p.photoId) all.add(p.photoId); if(p.pdfId) all.add(p.pdfId);
  if (p.folderId) trashFile(p.folderId);
  for (const id of all) trashFile(id);
}
async function multipart(meta, blob, mime){
  const b = 'pat'+Math.random().toString(36).slice(2);
  const body = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${mime}\r\n\r\n`, blob, `\r\n--${b}--`]);
  const r = await api(UP+'?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
  return (await r.json()).id;
}
async function trashFile(id){ if(!id) return; try{ await api(DRIVE+'/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})}); }catch(e){} }
const blobCache = new Map();
async function fileBlob(id, mime){
  if (blobCache.has(id)) return blobCache.get(id);
  const r = await api(DRIVE+'/'+id+'?alt=media'); const b = await r.blob();
  const out = mime ? new Blob([b],{type:mime}) : b; blobCache.set(id,out); return out;
}

/* ---- synchronisation ---- */
async function fetchRemote(){
  await ensureFolders();
  if (!ids.data){
    const f = await listFiles(`name='${DATA_NAME}' and '${ids.root}' in parents and trashed=false`);
    if (!f.length) return null;
    ids.data=f[0].id; LS.dataId=ids.data;
  }
  let r;
  try { r = await api(DRIVE+'/'+ids.data+'?alt=media'); }
  catch(e){ if (/ 404 /.test(e.message)){ ids.data=''; delete LS.dataId; return fetchRemote(); } throw e; }
  const txt = await r.text();
  let json; try{ json = JSON.parse(txt); }catch(e){ throw new Error('Fichier de données Drive illisible : synchro arrêtée pour protéger vos données'); }
  if ((json.version||1) > DATA_VERSION) throw new Error('Vos données viennent d\'une version plus récente : fermez complètement l\'application et rouvrez-la');
  return {data:migrate(json), raw:txt};
}
async function pushRemote(d){
  const body = JSON.stringify(Object.assign({}, d, {savedAt:Date.now()}));
  if (ids.data){
    await api(UP+'/'+ids.data+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});
  } else {
    ids.data = await multipart({name:DATA_NAME,parents:[ids.root]}, new Blob([body]), 'application/json');
    LS.dataId = ids.data;
  }
}
async function maybeBackup(rawRemote){
  const today = new Date().toISOString().slice(0,10);
  if (LS.lastBackup===today) return;
  const name = 'sauvegarde-'+today+'.json';
  const ex = await listFiles(`name='${name}' and '${ids.backups}' in parents and trashed=false`);
  if (!ex.length) await multipart({name,parents:[ids.backups]}, new Blob([rawRemote]), 'application/json');
  LS.lastBackup = today;
  const all = await listFiles(`'${ids.backups}' in parents and trashed=false`, '&orderBy='+encodeURIComponent('createdTime desc'));
  for (const f of all.slice(BACKUPS_KEPT)) await trashFile(f.id);
}
let syncing=false, syncTimer=null;
function setSync(st, err){ state.sync.st=st; state.sync.err=err||''; $('#dot').className='dot '+st; renderBanner(); }
function scheduleSync(){ clearTimeout(syncTimer); syncTimer=setTimeout(()=>sync(false),1500); }
async function sync(interactive){
  if (syncing) return;
  if (!configured()){ setSync('err','ID client Google non renseigné'); return; }
  if (!navigator.onLine){ setSync('off'); return; }
  syncing=true; setSync('busy');
  try{
    await getToken(interactive);
    const remote = await fetchRemote();
    const merged = remote ? merge(state.data, remote.data) : state.data;
    if (!remote || sig(merged)!==sig(remote.data)){
      if (remote) await maybeBackup(remote.raw);
      await pushRemote(merged);
    }
    state.data = merged; state.dirty=false; await saveLocal();
    state.sync.last = Date.now(); LS.lastSync = state.sync.last;
    setSync('ok'); render();
  }catch(e){
    console.error(e);
    setSync(/popup|annul|access_denied|interaction|login_required|consent/i.test(e.message)?'off':'err', e.message);
  }finally{ syncing=false; }
}

/* ============ IMAGES ============ */
async function loadBitmap(file){
  if (window.createImageBitmap){ try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){} }
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
}
async function resize(file, max, q){
  const bm = await loadBitmap(file);
  const w = bm.width||bm.naturalWidth, hh = bm.height||bm.naturalHeight, s = Math.min(1, max/Math.max(w,hh));
  const c = document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(hh*s);
  c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  return {canvas:c, blob:await new Promise(r=>c.toBlob(r,'image/jpeg',q))};
}

            : h('button',{type:'button',class:'pmk','aria-label':'Définir comme photo principale',onclick:()=>{photoItems.unshift(photoItems.splice(i,1)[0]);drawPhotos();}},ic('star',true)),
      h('button',{type:'button',class:'px','aria-label':'Retirer la photo',onclick:()=>{photoItems.splice(i,1);drawPhotos();}},'×'))),
    h('label',{class:'padd'},ic('plus'),h('span',{},'Photos'),h('input',{type:'file',accept:'image/*',multiple:true,style:'display:none',onchange:e=>{
      for (const f of e.target.files) photoItems.push({kind:'new',file:f,url:URL.createObjectURL(f),name:f.name});
      e.target.value=''; drawPhotos(); }})));
  drawPhotos();
  const txt=(n,lab,ph,mode)=>h('label',{class:'f'},lab,h('input',{type:'text',name:n,value:t[n],placeholder:ph||'',inputmode:mode||'text',autocomplete:'off'}));
  const f=h('form',{onsubmit:e=>e.preventDefault()},
    h('label',{class:'f'},'Photos du tissu'), h('div',{class:'fhint'},'La première est la photo principale. Touchez l\'étoile d\'une autre photo pour la choisir à la place.'), photoBox,
    h('label',{class:'f',style:'margin-top:20px'},'Nom *',h('input',{type:'text',name:'name',value:t.name,autocomplete:'off'})),
    h('div',{class:'lbl',style:'margin:18px 0 0'},'Matière'),
    h('label',{class:'f'},'Type de matière',typeBox),
    h('label',{class:'f'},'Composition',compBox),
    txt('color','Couleur','ex. vert sauge'),
    h('div',{class:'two'},
      txt('width','Laize (cm)','ex. 140','decimal'),
      txt('length','Métrage en stock (cm)','ex. 250','decimal')),
    h('div',{style:'display:flex;gap:28px;margin-top:16px'},
      h('label',{style:'display:flex;gap:10px;align-items:center;font-weight:700'},h('input',{type:'checkbox',name:'scrap',checked:t.scrap}),'Chute'),
      h('label',{style:'display:flex;gap:10px;align-items:center;font-weight:700'},h('input',{type:'checkbox',name:'prewashed',checked:t.prewashed}),'Prélavé')),
    txt('store','Acheté chez'),
    txt('location','Emplacement','ex. étagère 2, bac bleu'),
    h('label',{class:'f'},'Notes',h('textarea',{name:'notes'},t.notes)),
    h('label',{class:'f',style:'display:flex;gap:10px;align-items:center'},h('input',{type:'checkbox',name:'favorite',checked:t.favorite}),'Favori'));
  const save=h('button',{class:'btn pri',onclick:async()=>{
    const v=n=>f.querySelector('[name="'+n+'"]').value.trim();  // (f.elements.length serait le nombre de champs, pas le champ « length »)
    if(!v('name')){ toast('Le nom est obligatoire'); return; }
    save.disabled=true;
    const total=photoItems.filter(x=>x.kind==='new').length; let done=0;
    const tick=()=>{ save.textContent= total? `Envoi des photos… ${done}/${total}` : 'Enregistrement…'; }; tick();
    try{
      t.name=v('name'); const base=cleanName(t.name)||'Tissu';
      for (const it of photoItems) if (it.kind==='new'){
        const full=await resize(it.file,1600,.85), th=await resize(it.file,240,.66);
        const n=photoItems.indexOf(it)+1;
        const fid=await textileUpload(t,full.blob,`${base} - photo ${n}.jpg`,'image/jpeg');
        Object.assign(it,{kind:'old',id:fid,thumb:th.canvas.toDataURL('image/jpeg',.66),parent:t.folderId}); done++; tick();
      }
      t.photos=photoItems.map(x=>({id:x.id,thumb:x.thumb||'',parent:x.parent||''}));
      Object.assign(t,{photoId:t.photos[0]?t.photos[0].id:'',thumb:t.photos[0]?t.photos[0].thumb:''});
      if (old){ const keep=new Set(t.photos.map(x=>x.id)); for (const it of old.photos) if(!keep.has(it.id)) trashFile(it.id); }
      if (navigator.onLine && LS.signed){
        if (old && t.folderId && old.name!==t.name) renameFile(t.folderId,base).catch(()=>{});
        await tidyTextile(t);
      }
      const num=x=>x.replace(',','.');
      Object.assign(t,{matTypes:[...mTypes],compositions:[...comps],matV:1,color:v('color'),width:num(v('width')),length:num(v('length')),unit:'cm',store:v('store'),location:v('location'),scrap:f.querySelector('[name=scrap]').checked,prewashed:f.querySelector('[name=prewashed]').checked,notes:f.querySelector('[name=notes]').value.trim(),favorite:f.querySelector('[name=favorite]').checked});
      t.updated=Date.now(); if(!t.created) t.created=t.updated;
      const i=state.data.textiles.findIndex(x=>x.id===t.id);
      if(i>=0) state.data.textiles[i]=t; else state.data.textiles.push(t);
      await commit(); closeSheet(); render(); toast('Tissu enregistré');
    }catch(e){
      save.disabled=false; save.textContent='Enregistrer';
      toast('Échec : '+e.message+(total?' — connectez-vous à Drive pour ajouter des photos':''));
    }
  }},'Enregistrer');
  openSheet(f,{label:'Annuler',foot:[save]});
}

/* ============ DÉMARRAGE ============ */
$('#bMenu').replaceChildren(ic('menu'));
$('#bCloud').insertAdjacentHTML('afterbegin',CLOUD_SVG);
$('#bMenu').onclick=()=>nav('settings');
$('#bCloud').onclick=()=>nav('s-sync');
$('#bAdd').onclick=()=>state.view==='tissus'?openTextileForm(null):openForm(null);
window.addEventListener('online',()=>sync(false));
window.addEventListener('resize',fitTitle);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitTitle);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&LS.signed) sync(false); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sheetOpen) closeSheet(); });
(async function init(){
  history.replaceState({view:'home'},'');
  try{ const s=await kvGet('data'); if(s){ state.data=migrate(s.data); state.dirty=!!s.dirty; } }catch(e){}
  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  whenGis(()=>{ if (LS.signed) sync(false); else renderBanner(); });
  if (!navigator.onLine) setSync('off');
})();
